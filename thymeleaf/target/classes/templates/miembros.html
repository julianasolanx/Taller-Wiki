<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Members</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/script.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main>
    <h2>Miembros Del Grupo</h2>

    <!-- Select -->
    <label for="memberSelect">Selecciona un miembro:</label>
    <select id="memberSelect">
        <option value="">-- Choose --</option>
        <option th:each="m : ${members}"
                th:value="${m.id}"
                th:text="${m.name}">
        </option>
    </select>

    <!-- Member info -->
    <div id="memberInfo" style="margin-top:20px; display:none;">
        <p><strong>Nombre:</strong> <span id="name"></span></p>
        <p><strong>Rol:</strong> <span id="role"></span></p>
        <p><strong>Email:</strong> <span id="email"></span></p>
        <!-- <p><strong>ID:</strong> <span id="id"></span></p> -->
    </div>

    <!-- Hidden JSON data -->
    <script th:inline="javascript">
        const membersData = [[${members}]];
    </script>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
